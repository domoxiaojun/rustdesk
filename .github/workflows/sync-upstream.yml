name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: Force a build even if this official version already exists
        required: true
        default: false
        type: boolean
      release_tag:
        description: Optional tag such as v1.4.9-1; defaults to the Cargo version
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Verify sync token
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::Repository secret UPSTREAM_SYNC_TOKEN is required for upstream pushes."
            exit 1
          fi

      - name: Checkout fork master
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: master
          submodules: false
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          persist-credentials: false

      - name: Configure temporary Git credentials
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_header"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge official upstream
        id: sync
        run: bash .github/scripts/sync-upstream.sh

      - name: Push synchronized master
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Record sync result
        env:
          SYNC_CHANGED: ${{ steps.sync.outputs.changed }}
          SYNC_HEAD: ${{ steps.sync.outputs.head }}
          SYNC_HBB: ${{ steps.sync.outputs.hbb }}
        run: |
          {
            echo "### RustDesk upstream sync"
            echo "- Changed: $SYNC_CHANGED"
            echo "- HEAD: \`$SYNC_HEAD\`"
            echo "- hbb_common: \`$SYNC_HBB\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: >-
      needs.sync.outputs.changed == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_release)
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify sync token
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::Repository secret UPSTREAM_SYNC_TOKEN is required for release tags and workflow dispatch."
            exit 1
          fi

      - name: Checkout synchronized master
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          persist-credentials: false

      - name: Configure temporary Git credentials
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_header"

      - name: Create release tag
        id: tag
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: bash .github/scripts/prepare-release.sh

      - name: Dispatch release builds
        if: steps.tag.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run flutter-tag.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          gh workflow run fdroid.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"

      - name: Record release result
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_CREATED: ${{ steps.tag.outputs.created }}
          RELEASE_REASON: ${{ steps.tag.outputs.reason }}
          RELEASE_DISPATCH: ${{ steps.tag.outputs.dispatch }}
        run: |
          {
            echo "### Release dispatch"
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Tag created: $RELEASE_CREATED"
            echo "- Reason: $RELEASE_REASON"
            echo "- Workflows dispatched: $RELEASE_DISPATCH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Git credentials
        if: always()
        run: git config --local --unset-all http.https://github.com/.extraheader || true
