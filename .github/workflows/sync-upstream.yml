name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: Force a build even if this official version already exists
        required: true
        default: false
        type: boolean
      release_tag:
        description: Optional tag such as v1.4.9-1; defaults to the Cargo version
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout fork master
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: master
          submodules: false

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge official upstream
        id: sync
        run: bash .github/scripts/sync-upstream.sh

      - name: Push synchronized master
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Record sync result
        run: |
          {
            echo "### RustDesk upstream sync"
            echo "- Changed: ${{ steps.sync.outputs.changed }}"
            echo "- HEAD: \`${{ steps.sync.outputs.head }}\`"
            echo "- hbb_common: \`${{ steps.sync.outputs.hbb }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: >-
      needs.sync.outputs.changed == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_release)
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout synchronized master
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: master

      - name: Create release tag
        id: tag
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          resolve_remote_tag() {
            local candidate="$1"
            local object
            local peeled

            object="$(git ls-remote origin "refs/tags/$candidate" | awk 'NR == 1 { print $1 }')"
            [ -n "$object" ] || return 1
            peeled="$(git ls-remote origin "refs/tags/$candidate^{}" | awk 'NR == 1 { print $1 }')"
            printf '%s\n' "${peeled:-$object}"
          }

          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "Cannot read Cargo version" >&2; exit 1; }
          base_tag="v$version"
          head_sha="$(git rev-parse HEAD)"
          base_commit="$(resolve_remote_tag "$base_tag" || true)"
          dispatch=false
          created=false
          reason=""

          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
            dispatch=true
            reason="requested tag"
          elif [ -z "$base_commit" ]; then
            tag="$base_tag"
            dispatch=true
            reason="new official version"
          elif [ "$base_commit" = "$head_sha" ]; then
            tag="$base_tag"
            if [ "$FORCE_BUILD" = "true" ]; then
              dispatch=true
              reason="requested rebuild"
            else
              reason="version already built from current HEAD"
            fi
          elif [ "$FORCE_BUILD" = "true" ]; then
            max_revision=0
            while IFS= read -r existing_tag; do
              revision="${existing_tag#"$base_tag-"}"
              if [[ "$revision" =~ ^[0-9]+$ ]] && (( revision > max_revision )); then
                max_revision="$revision"
              fi
            done < <(
              git ls-remote --tags --refs origin "refs/tags/$base_tag-*" \
                | awk -F/ '{ print $3 }'
            )
            tag="$base_tag-$((max_revision + 1))"
            dispatch=true
            reason="requested revision build"
          else
            tag="$base_tag"
            reason="official version already has a release"
          fi

          [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]] \
            || { echo "Invalid release tag: $tag" >&2; exit 1; }

          if [ "$dispatch" = "true" ]; then
            remote_commit="$(resolve_remote_tag "$tag" || true)"
            if [ -n "$remote_commit" ]; then
              [ "$remote_commit" = "$head_sha" ] || {
                echo "$tag already points to another commit" >&2
                exit 1
              }
            else
              git tag "$tag" "$head_sha"
              git push origin "refs/tags/$tag"
              created=true
            fi
          fi

          {
            echo "tag=$tag"
            echo "created=$created"
            echo "dispatch=$dispatch"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch release builds
        if: steps.tag.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run flutter-tag.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          gh workflow run fdroid.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"

      - name: Record release result
        run: |
          {
            echo "### Release dispatch"
            echo "- Tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Tag created: ${{ steps.tag.outputs.created }}"
            echo "- Reason: ${{ steps.tag.outputs.reason }}"
            echo "- Workflows dispatched: ${{ steps.tag.outputs.dispatch }}"
          } >> "$GITHUB_STEP_SUMMARY"
